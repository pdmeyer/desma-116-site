# Hugo configuration file
title: DESMA 116 Fall 2026

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true
      hardWraps: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Schedule
      pageRef: /schedule
      weight: 1
    - name: Assignments
      pageRef: /assignments
      weight: 2
    - name: Resources
      pageRef: /resources
      weight: 3

params:
  description: Site for Sonic Media at UCLA | DMA Fall 2026
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    # base: "https://github.com/imfing/hextra-starter-template/edit/main/content"

  theme:
    default: system
    displayToggle: true

  displayUpdatedDate: true
  dateFormat: "2026-01-01"
